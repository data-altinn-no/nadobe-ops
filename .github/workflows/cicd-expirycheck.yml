# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - expirycheck

on:
  push:
    branches:
      - main
  # Pull requests (including Dependabot) build and test only; publish and deploy are gated below.
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PROJECT: 'src/Nadobe.Ops.Functions' # the function app project to deploy
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './output' # publish output handed to the deploy action
  DOTNET_VERSION: '10.0.x' # set this to the dotnet version to use

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Restore Dependencies'
        run: dotnet restore

      - name: 'Build Solution'
        run: dotnet build --configuration Release --no-restore

      - name: 'Run Tests'
        run: dotnet test --configuration Release --no-build

      # Publishes the function app alone. Building the solution into a single output
      # folder would ship the test project and its frameworks to Azure.
      - name: 'Publish Function App'
        if: github.event_name != 'pull_request'
        run: dotnet publish ${{ env.AZURE_FUNCTIONAPP_PROJECT }} --configuration Release --output ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      # Deploys with the publish profile. The app runs on a Flex Consumption plan, and the
      # action cannot detect that from a publish profile, so 'sku' must be set explicitly or
      # it falls back to Kudu zipdeploy, which Flex does not offer.
      - name: 'Run Azure Functions Action'
        if: github.event_name != 'pull_request'
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        id: fa
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_869FD5489B3C4ED3A8ACE4247500DC68 }}
          sku: 'flexconsumption'
