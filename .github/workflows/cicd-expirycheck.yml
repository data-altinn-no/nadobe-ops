# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - expirycheck

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PROJECT: 'src/Nadobe.Ops.Functions' # the function app project to deploy
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './output' # publish output handed to the deploy action
  DOTNET_VERSION: '10.0.x' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Restore Dependencies'
        run: dotnet restore

      - name: 'Build Solution'
        run: dotnet build --configuration Release --no-restore

      - name: 'Run Tests'
        run: dotnet test --configuration Release --no-build

      # Publishes the function app alone. Building the solution into a single output
      # folder would ship the test project and its frameworks to Azure.
      - name: 'Publish Function App'
        run: dotnet publish ${{ env.AZURE_FUNCTIONAPP_PROJECT }} --configuration Release --output ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_869FD5489B3C4ED3A8ACE4247500DC68 }}
